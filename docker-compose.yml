services:
  postgres:
    image: postgres:16-alpine
    container_name: seculicense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seculicense_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seculicense_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-seculicense_hub}
    ports:
      # Đổi cổng host nếu máy đã cài PostgreSQL cục bộ: POSTGRES_PORT=5433 docker compose up -d
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - seculicense_pgdata:/var/lib/postgresql/data
      # Tự động khởi tạo 7 bảng chuẩn SecuLicense Hub ở lần chạy đầu tiên
      - ./specs/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seculicense_admin} -d ${POSTGRES_DB:-seculicense_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: seculicense_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-seculicense_meili_master_key_2026}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - seculicense_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seculicense_pgdata:
  seculicense_meili_data:
